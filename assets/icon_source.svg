<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright blue sky background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#7dbef0;stop-opacity:1"/>
      <stop offset="55%"  style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1"/>
    </linearGradient>

    <!-- Ambient glow behind the keycap -->
    <radialGradient id="ambient-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   style="stop-color:#bae6fd;stop-opacity:0.55"/>
      <stop offset="60%"  style="stop-color:#7dd3fc;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0"/>
    </radialGradient>

    <!-- Keycap outer edge (depth) -->
    <linearGradient id="key-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#f4f7fb;stop-opacity:1"/>
      <stop offset="50%"  style="stop-color:#c5cdd8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9aa6b8;stop-opacity:1"/>
    </linearGradient>

    <!-- Keycap inner face -->
    <linearGradient id="key-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg-grad)"/>

  <!-- Ambient soft glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#ambient-glow)"/>

  <!-- Keyboard Key / Language Icon -->
  <g transform="translate(512, 512) scale(2.0)" filter="url(#soft-shadow)">
    <!-- Keycap Base (Outer Edge) -->
    <rect x="-140" y="-140" width="280" height="280" rx="36" fill="url(#key-edge)" />
    <!-- Keycap Front Face -->
    <rect x="-124" y="-124" width="248" height="230" rx="24" fill="url(#key-face)" />
    
    <!-- Globe Icon (Language Switcher) -->
    <g transform="translate(0, -10) scale(0.9)" stroke="#3b82f6" stroke-linecap="round" fill="none">
      <!-- Outer Circle -->
      <circle cx="0" cy="0" r="70" stroke-width="12" />
      <!-- Vertical Ellipse -->
      <ellipse cx="0" cy="0" rx="30" ry="70" stroke-width="12" />
      <!-- Horizontal Equator -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke-width="12" />
      <!-- Top Horizontal Line -->
      <line x1="-54" y1="-44" x2="54" y2="-44" stroke-width="12" />
      <!-- Bottom Horizontal Line -->
      <line x1="-54" y1="44" x2="54" y2="44" stroke-width="12" />
    </g>
    
    <!-- A and Ç (Languages/Keyboard symbol) in the bottom corners -->
    <text x="-90" y="85" font-family="sans-serif" font-weight="bold" font-size="32" fill="#64748b">A</text>
    <text x="60" y="85" font-family="sans-serif" font-weight="bold" font-size="32" fill="#64748b">Ç</text>
  </g>

  <!-- Subtle top sheen on the squircle (Tahoe glass) -->
  <path d="M 0 0 H 1024 V 320 Q 512 460 0 320 Z" fill="rgba(255,255,255,0.05)"/>
</svg>
